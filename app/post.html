<!DOCTYPE html>
<html>
<head>
  <title>Urbit Feed</title>
  <script src="https://unpkg.com/@urbit/http-api"></script>
  <link rel="stylesheet" href="/urbitbrowser/style.css">
</head>
<body>
  <header class="underlineText">
    <a id="title" href="/urbitbrowser">Urbit Feed</a>
    <div id="loginButtons">
      <div id="sigilContainer" style="display:none;"></div>
      <button id="logOut" style="display:none;">Log out</button>
      <button id="logIn" style="display:none;">Log in</button>
    </div>
  </header>
  
  <main>
    <div id="logInContainer" style="display:none;">
      <div id="logInContent">
        <div class="logInContainerPart">
          <div>Log in with Azimuth if you have Urbit ID held in a Meta Mask wallet.</div>
          <div id="metaMaskSection">
            <input type="text" id="urbitId" placeholder="~sampel-palnet"/>
            <button id="signInWithMetaMaskButton">Azimuth Sign in</button>
          </div>
        </div>
        <div class="grey">or</div>
        <div class="logInContainerPart">
          <div>
            <div>Log in with Arvo to connect via Urbit network.</div>
          </div>
          <button id="arvoLoginButton">Arvo Sign in</button>
        </div>
      </div>
    </div>

    <div id="postContainer" class="container"></div>
  </main>

  <script type="module">
    import sigil from 'https://cdn.skypack.dev/-/@urbit/sigil-js@v2.2.0-lDYj1dosVWwKkEkrNWyi/dist=es2019,mode=imports/optimized/@urbit/sigil-js.js'
    window.ship = "fun";

    document.addEventListener("DOMContentLoaded", async function() {
      let post = {}
      const api = new UrbitHttpApi.Urbit("");
      api.ship = window.ship;
      const urlPath = window.location.pathname;
      const path = urlPath.substring(urlPath.indexOf('/', 1))
  
      function postSub() {
        window.id = api.subscribe({
          app: "urbitbrowser",
          path: path,
          event: renderPost,
          quit: postSub,
          err:()=>{console.error('Subscription fail')}
        });
      }

      try{
        const response = await fetch('/urbitbrowser/state');

        const data = await response.json();

        const { paths, challenge: servChallenge, rank: userRank, patp} = data;


        if (userRank === "comet"){
          showCometLogin();
        }else{
          if(Rank() === "comet"){
            localStorage.setItem('challenge', JSON.stringify(servChallenge));
            localStorage.setItem('rank', JSON.stringify(userRank));
            localStorage.setItem('urbitId', JSON.stringify(patp));
          }

          showCommentSubmit()
        }
        postSub()
      }catch(err){
        console.log("Error fetching state:", err);
      }

      function showCometLogin() {
        const logInButton = document.getElementById("logIn")
        logInButton.style.display = "inline-block";
        const logInContainer = document.getElementById("logInContainer")
        const logInContent = document.getElementById("logInContent")

        logInButton.addEventListener("click", () => {
          logInPopUp()
        })

        logInContainer.addEventListener("click", (event) => {
          if (!logInContent.contains(event.target)) {
            logInContainer.style.display = "none";
            document.body.style.overflow = "auto";
          }
        })

        document.getElementById("arvoLoginButton").addEventListener("click", function() {
          window.location.href = `/~/login?redirect=${window.location.pathname}&eauth`;
        });

        document.getElementById("signInWithMetaMaskButton").addEventListener("click", signInWithMetaMask);

        async function signInWithMetaMask() {
          try {
            const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
            const account = accounts[0];
            const signature = await window.ethereum.request({
              method: "personal_sign",
              params: [account, Challenge()],
            });
            const body = {
              who: document.getElementById("urbitId").value,
              address: account,
              signature: signature,
              secret: Challenge(),
            };
            const response = await fetch('/urbitbrowser', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ auth: body }),
            });
            if (response.ok) {
              location.reload();
            } else {
              alert("Login failed. Please try again.");
            }
          } catch (error) {
            console.error("MetaMask login failed:", error);
            alert("An error occurred during MetaMask login. Please try again.");
          }
        }
      }

      function showCommentSubmit(){
        let logOut = document.getElementById("logOut")
        logOut.style.display = "inline-block";
        logOut.addEventListener("click", () => {
          localStorage.setItem('rank', JSON.stringify('comet'));
          localStorage.removeItem('challenge');
          localStorage.removeItem('urbitId');
          window.location.href = `/~/logout?redirect=${window.location.pathname}&eauth`;
        })

        const patp = UrbitId()

        const sigilSVG = sigil({
          point: patp,
          size: 15,
          background:'#0b0b07', 
          foreground:'white',
          detail: 'none',
          space:'none',
        })

        let sigilContainer = document.getElementById('sigilContainer')
        sigilContainer.style.display = "flex"
        sigilContainer.style.alignItems = 'center'
        sigilContainer.innerHTML = sigilSVG 
      }

      function renderPost(postUpdate){

        post = postUpdate
        const pathText = path.substring(path.indexOf('/', 1))

        console.log(postUpdate)

        const { title, when, votes, score, submitter, body, link, tags, comments } = postUpdate;

        console.log(link)
        
        const container = document.getElementById("postContainer")
        
        container.innerHTML = ''

        const timestamp = timeAgo(when);
        const containerHeader = document.createElement("div")
        containerHeader.id = 'containerHeader'
        // containerHeader.className = 'post'
        const containerPost = document.createElement("div")
        containerPost.id = 'containerPost'
        containerPost.className = 'postContent'

        const postTitle = document.createElement("div")
        postTitle.id = "postTitle"
        postTitle.className = "postTitle";
        console.log(title)

        const titleText = document.createElement("div")
        titleText.id = "titleText"
        titleText.innerText = title

        const urlIcon = document.createElement("a")
        urlIcon.id = "urlImgContainer"
        urlIcon.href = link
        urlIcon.innerHTML = `<img class="arrIcon" src="/urbitbrowser/fil/url-icon.svg" alt="url-icon">`

        const pathContainer = document.createElement("a")
        pathContainer.id = 'pathContainer'
        pathContainer.href = link
        pathContainer.innerText = pathText.slice(1)

        postTitle.appendChild(titleText)
        postTitle.appendChild(urlIcon)
        postTitle.appendChild(pathContainer)

        const editTitleForm = document.createElement("div")
        editTitleForm.style.display = "none"
        editTitleForm.id =  "editTitle" 

        const titleInput = document.createElement("input")
        titleInput.placeholder = "Title"
        titleInput.value = title
        editTitleForm.appendChild(titleInput)

        const postInfo = document.createElement("div")
        postInfo.className = "postInfo";
        const postText = document.createElement("div")
        postText.className = "postData";

        postText.innerHTML = 
          `${submitter} 
          <img class='separator' src="/urbitbrowser/fil/separator-icon.svg" alt="separartor-icon">  
          ${timestamp}`;

        const tagsContainer = document.createElement("div")
        tagsContainer.className = "tagsContainer"
        if (tags.length != 0){
          const lastSeparator= document.createElement('img')
          lastSeparator.className = "separator"
          lastSeparator.src = "/urbitbrowser/fil/separator-icon.svg"
          lastSeparator.alt = "separartor-icon"
          postText.append(lastSeparator)
        }
        tags.forEach(tag => {
          const tagElement = document.createElement('button');
          tagElement.className = "tag"
          tagElement.innerHTML = tag
          tagsContainer.appendChild(tagElement)
        })

        containerPost.appendChild(postTitle)
        containerPost.appendChild(editTitleForm)
        // containerPost.appendChild(postPath)
        postInfo.appendChild(postText)
        postInfo.appendChild(tagsContainer);
        // containerPost.innerHTML = containerPostHTML
        containerPost.appendChild(postInfo)
        
        if(body != ''){
          const bodyElement = document.createElement("div")
          bodyElement.id = 'bodyPost'
          bodyElement.className = "commentBody"
          bodyElement.innerHTML = `<div id="commentBodyContainer">${body}</div>`
          containerHeader.append(bodyElement)
        }
        const bodyInput = document.createElement("textarea")
        bodyInput.className = "commentBody"
        bodyInput.placeholder = "Body"
        bodyInput.value = body
        bodyInput.style.display = "none"
        containerHeader.append(bodyInput)

        const withoutFirstSlash = pathText.startsWith('/') ? pathText.slice(1) : pathText;
        console.log(pathText)
        console.log(withoutFirstSlash)
        const shipName = withoutFirstSlash.split('/')[0];
        console.log(shipName)

        if(UrbitId() === shipName){
          const editButton = document.createElement("button")
          editButton.id = "edit"
          editButton.innerHTML = `Edit`
          postTitle.appendChild(editButton)

          editButton.addEventListener("click", () => {
            postTitle.style.display = "none"
            editTitleForm.style.display = "flex"

            if(body != ''){
              const bodyElement = document.getElementById('bodyPost')
              bodyElement.style.display = "none"
            }
            bodyInput.style.display = "flex"
          })
        }

        const voteSection = document.createElement("div")
        voteSection.className = "voteSection"
        const scoreEl = document.createElement("div")
        scoreEl.classList = "scoreEl"
        scoreEl.innerHTML = score
        const upArrow = document.createElement("div");
        upArrow.className = "voteArrow";
        upArrow.innerHTML = `<img class="arrIcon" src="/urbitbrowser/fil/lus-icon.svg" alt="lus-icon">`
        upArrow.addEventListener("click", () => voteOnPath(postPath, true));

        const downArrow = document.createElement("div");
        downArrow.className = "voteArrow";
        downArrow.innerHTML = `<img class="arrIcon" src="/urbitbrowser/fil/hep-icon.svg" 
        style="width: 9px; height: 9px" alt="hep-icon">`
        downArrow.addEventListener("click", () => voteOnPath(postPath, false));

        if(votes){
          const isVoted = votes.find(element => element.ship === UrbitId());
          if(isVoted && isVoted.vote === true){
            upArrow.classList = "voteArrow hovered"
          }
          if(isVoted && isVoted.vote === false){
            downArrow.classList = "voteArrow hovered"
          }
        }

        voteSection.appendChild(upArrow);
        voteSection.appendChild(scoreEl);
        voteSection.appendChild(downArrow);
        containerHeader.append(voteSection);
        containerHeader.append(containerPost);
        container.append(containerHeader);

        const commentsContainer = document.createElement('div');
        commentsContainer.className = 'commentsContainer'

        let commentsReverse = comments.reverse()

        function createCommentHTML(comment) {
          const timestamp = timeAgo(comment.when);
          const commentContainer = document.createElement('div')
          commentContainer.className = "comment"

          const commentHeader = document.createElement('div')
          commentHeader.className = "commentInfo"

          let sigilContainer = document.createElement('div')
          sigilContainer.style.display = "flex"
          sigilContainer.style.alignItems = 'center'
           
          const sigilSVG = sigil({
            point: comment.who,
            size: 13,
            background:'#0b0b07', 
            foreground: '#7D7D79',
            // detail:'default',
            detail: 'none',
            space:'none',
          })
          sigilContainer.innerHTML = sigilSVG 

          let commentData = document.createElement('div')
          commentData.className = "postData grey"
          commentData.innerHTML = 
          `${comment.who} 
          <img class='separator' src="/urbitbrowser/fil/separator-icon.svg" alt="separartor-icon"> 
          <div class='grey'>${timestamp}</div>`

          let commentText = document.createElement('div')
          commentText.innerText = comment.what
          commentText.className = "commentText"

          commentHeader.appendChild(sigilContainer)
          commentHeader.appendChild(commentData)
          commentContainer.appendChild(commentHeader)
          commentContainer.appendChild(commentText)

          return commentContainer
        }
          
          if(Rank() === 'comet'){
            commentsReverse.forEach(comment => {
              const commentElement = createCommentHTML(comment);
              commentsContainer.appendChild(commentElement);
            });
          }else{
            const commentForm = `
              <form id="commentForm" class="container">
                <input type="text" id="commentText" placeholder="Add a comment" required>
                <button type="submit">Comment</button>
              </form>
            `;

            commentsContainer.innerHTML = commentForm

            commentsReverse.forEach(comment => {
              const commentElement = createCommentHTML(comment);
              commentsContainer.appendChild(commentElement);
            });

            setTimeout(() => {
              const form = document.getElementById('commentForm');
              if(form) {

              form.addEventListener('submit', async (e) => {
                e.preventDefault()
                const commentText = document.getElementById(`commentText`).value;
    
                try {
                  const resp = await fetch('/urbitbrowser', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ comment: { path: postPath, text: commentText }})
                  });
                  if(resp.status === 200){
                    console.log('published a comment')
                  }
                }catch (error) {
                  console.error("Error submitting post:", error);
                  }
                })
              }
            }, 0)
          }

        container.append(commentsContainer)
      }

      async function voteOnPath(path, isUpvote) {
        if (Rank() === "comet") {
          logInPopUp()
        }
        try {
          const resp = await fetch('/urbitbrowser', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ vote: { path: path, vote: isUpvote } })
          });
          if (resp.ok) {
            console.log('voted')
          } else {
            console.error("Vote failed");
          }
        } catch (err) {
          console.error("Error sending vote:", err);
        }
      }
    })
    function Challenge(){
      return JSON.parse(localStorage.getItem('challenge'))
    }
    function UrbitId(){
      return JSON.parse(localStorage.getItem('urbitId'))
    }
    function Rank(){
      return JSON.parse(localStorage.getItem('rank'))
    }

    function timeAgo(when) {
      const now = new Date();
      const diff = now - new Date(when);
    
      const seconds = Math.floor(diff / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);
      const months = Math.floor(days / 30);
      const years = Math.floor(days / 365);
    
      if (years > 1) {
        return `${years} years ago`;
      } else if (years === 1) {
        return '1 year ago';
      } else if (months > 1) {
        return `${months} months ago`;
      } else if (months === 1) {
        return '1 month ago';
      } else if (days > 1) {
        return `${days} days ago`;
      } else if (days === 1) {
        return '1 day ago';
      } else if (hours > 0 & hours < 24) {
        return `${hours} hours ago`;
      } else if (minutes > 1 & minutes < 60) {
        return `${minutes} minutes ago`;
      } else {
        return 'Just now';
      }
    }

    function logInPopUp(){
      const logInContainer = document.getElementById("logInContainer")
        logInContainer.style.display = "flex";
        document.body.style.overflow = "hidden";
      }
  </script>
</body>
</html>
