<!DOCTYPE html>
<html>
<head>
  <title>Urbit Browser</title>
  <script src="https://unpkg.com/@urbit/http-api"></script>
  <script src="/session.js"></script>
  <link rel="stylesheet" href="/urbitbrowser/style.css">
</head>
<body>
  <header class="underlineText">
    <a id="title" href="/urbitbrowser">Urbit Browser</a>
    <div id="loginButtons">
      <div id="sigilContainer" style="display:none;"></div>
      <button id="logOut" style="display:none;">Log out</button>
      <button id="logIn" style="display:none;">Log in</button>
    </div>
  </header>
  
  <main>
  <div id="postContainer" class="container"></div>
  </main>

  <script type="module">
    import sigil from 'https://cdn.skypack.dev/-/@urbit/sigil-js@v2.2.0-lDYj1dosVWwKkEkrNWyi/dist=es2019,mode=imports/optimized/@urbit/sigil-js.js'

    document.addEventListener("DOMContentLoaded", async function() {
      let post = {}
      const api = new UrbitHttpApi.Urbit("");
      api.ship = window.ship;
      const urlPath = window.location.pathname;
      const path = urlPath.substring(urlPath.indexOf('/', 1))
  
      function postSub() {

        window.id = api.subscribe({
          app: "urbitbrowser",
          path: path,
          event: renderPost,
          quit: postSub,
          err:()=>{console.log('Subscription fail')}
        });
      }
      try{
        console.log('rank', Rank())
        if (Rank() === "comet") {
          console.log('commet')
          showCometLogin();
        }

        postSub()
      }catch(err){
        console.error("Error fetching state:", err);
      }

      function showCometLogin() {
        const logInButton = document.getElementById("logIn")
        logInButton.style.display = "inline-block";
        const logInContainer = document.getElementById("logInContainer")
        const logInContent = document.getElementById("logInContent")

        logInButton.addEventListener("click", () => {
          logInContainer.style.display = "flex";
          document.body.style.overflow = "hidden";
        })

        logInContainer.addEventListener("click", (event) => {
          if (!logInContent.contains(event.target)) {
            logInContainer.style.display = "none";
            document.body.style.overflow = "auto";
          }
        })

        document.getElementById("arvoLoginButton").addEventListener("click", function() {
          window.location.href = '/urbitbrowser/eauth';
        });

        document.getElementById("signInWithMetaMaskButton").addEventListener("click", signInWithMetaMask);
      }

      function renderPost(postUpdate){
        let logOut = document.getElementById("logOut")
        logOut.style.display = "inline-block";

        //TODO: get patp !!

        const sigilSVG = sigil({
          point: 'lonhep-tamfeb',
          size: 15,
          background:'#0b0b07', 
          foreground:'white',
          detail:'default',
          space:'none',
        })

        let sigilContainer = document.getElementById('sigilContainer')
        sigilContainer.style.display = "flex"
        sigilContainer.style.alignItems = 'center'
        sigilContainer.innerHTML = sigilSVG 

        post = postUpdate
        console.log(postUpdate)
        const postPath = path.substring(path.indexOf('/', 1))

        const { when, votes, score, submitter, body, link, tags, comments } = postUpdate;
        
        const container = document.getElementById("postContainer")
        
        container.innerHTML = ''

        const timestamp = timeAgo(when);
        const containerHeader = document.createElement("div")
        containerHeader.id = 'containerHeader'
        containerHeader.className = 'post'
        const containerPost = document.createElement("div")
        containerPost.id = 'containerPost'
        containerPost.className = 'postContent'
        const containerPostHTML = 
        `<a class="postTitle" href=${link}>${postPath.slice(1)}</a>`

        const postInfo = document.createElement("div")
        postInfo.className = "postInfo";
        const postText = document.createElement("div")
        postText.className = "postData"

        postText.innerHTML = 
          `Submitted by ${submitter} 
          <img class='separator' src="/urbitbrowser/fil/separator-icon.svg" alt="separartor-icon">  
          ${timestamp}`;

        const tagsContainer = document.createElement("div")
        tagsContainer.className = "tagsContainer"
        if (tags.length != 0){
          const lastSeparator= document.createElement('img')
          lastSeparator.className = "separator"
          lastSeparator.src = "/urbitbrowser/fil/separator-icon.svg"
          lastSeparator.alt = "separartor-icon"
          postText.append(lastSeparator)
        }
        tags.forEach(tag => {
          const tagElement = document.createElement('button');
          tagElement.className = "tag"
          tagElement.innerHTML = tag
          tagsContainer.appendChild(tagElement)
        })

        postInfo.appendChild(postText)
        postInfo.appendChild(tagsContainer);
        containerPost.innerHTML = containerPostHTML
        containerPost.appendChild(postInfo)
        
        if(body != ''){
          const bodyElement = document.createElement("div")
          bodyElement.className = "commentBody"
          bodyElement.innerHTML = body
          containerPost.append(bodyElement)
        }

        const voteSection = document.createElement("div")
        voteSection.className = "voteSection"
        const scoreEl = document.createElement("div")
        scoreEl.innerHTML = score
        const upArrow = document.createElement("div");
        upArrow.className = "voteArrow";
        upArrow.textContent = "+";
        upArrow.addEventListener("click", () => voteOnPath(postPath, true));

        const downArrow = document.createElement("div");
        downArrow.className = "voteArrow";
        downArrow.textContent = "-";
        downArrow.addEventListener("click", () => voteOnPath(postPath, false));

        if(votes){
          const isVoted = votes.find(element => element.ship === UrbitId());
          if(isVoted && isVoted.vote === true){
            upArrow.style.fontWeight = 'bold';
          }
          if(isVoted && isVoted.vote === false){
            downArrow.style.fontWeight = 'bold';
          }
        }

        voteSection.appendChild(upArrow);
        voteSection.appendChild(scoreEl);
        voteSection.appendChild(downArrow);
        containerHeader.append(voteSection);
        containerHeader.append(containerPost);
        container.append(containerHeader);

        const commentsContainer = document.createElement('div');
        commentsContainer.className = 'commentsContainer'

        let commentsReverse = comments.reverse()

        function createCommentHTML(comment) {
          const timestamp = timeAgo(comment.when);
          const commentContainer = document.createElement('div')
          commentContainer.className = "comment"

          const commentHeader = document.createElement('div')
          commentHeader.className = "commentInfo"

          let sigilContainer = document.createElement('div')
          sigilContainer.style.display = "flex"
          sigilContainer.style.alignItems = 'center'
           
          const sigilSVG = sigil({
            point: comment.who,
            size: 15,
            background:'#0b0b07', 
            foreground:'white',
            detail:'default',
            space:'none',
          })
          sigilContainer.innerHTML = sigilSVG 

          let commentData = document.createElement('div')
          commentData.className = 'postData'
          commentData.innerHTML = 
          `${comment.who} 
          <img class='separator' src="/urbitbrowser/fil/separator-icon.svg" alt="separartor-icon"> 
          <div class='grey'>${timestamp}</div>`

          let commentText = document.createElement('div')
          commentText.innerText = comment.what

          commentHeader.appendChild(sigilContainer)
          commentHeader.appendChild(commentData)
          commentContainer.appendChild(commentHeader)
          commentContainer.appendChild(commentText)

          return commentContainer
        }
          
          if(Rank() === 'comet'){
            commentsReverse.forEach(comment => {
              const commentElement = createCommentHTML(comment);
              commentsContainer.appendChild(commentElement);
            });
          }else{
            const commentForm = `
              <form id="commentForm" class="container">
                <input type="text" id="commentText" placeholder="Add a comment" required>
                <button type="submit">Comment</button>
              </form>
            `;

            commentsContainer.innerHTML = commentForm

            commentsReverse.forEach(comment => {
              const commentElement = createCommentHTML(comment);
              commentsContainer.appendChild(commentElement);
            });

            setTimeout(() => {
              const form = document.getElementById('commentForm');
              if(form) {

              form.addEventListener('submit', async (e) => {
                console.log('submitting form')
                e.preventDefault()
                const commentText = document.getElementById(`commentText`).value;
                console.log('comment input value', commentText)
    
                try {
                  const resp = await fetch('/urbitbrowser', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ comment: { path: postPath, text: commentText }})
                  });
                  console.log(resp)
                  if(resp.status === 200){
                    console.log('published a comment')
                  }
                }catch (error) {
                  console.error("Error submitting post:", error);
                  }
                })
              }
            }, 0)
          }

        container.append(commentsContainer)
      }

      async function voteOnPath(path, isUpvote) {
        if (Rank() === "comet") {
          //  TODO: add login pop up
          alert("You must log in to vote.");
          return;
        }
        try {
          console.log(path)
          const resp = await fetch('/urbitbrowser', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ vote: { path: path, vote: isUpvote } })
          });
          if (resp.ok) {
            console.log('voted')
          } else {
            alert("Vote failed");
          }
        } catch (err) {
          console.error("Error sending vote:", err);
          alert("Vote error");
        }
      }
    })
    function Challenge(){
      return JSON.parse(localStorage.getItem('challenge'))
    }
    function UrbitId(){
      return JSON.parse(localStorage.getItem('urbitId'))
    }
    function Rank(){
      return JSON.parse(localStorage.getItem('rank'))
    }

    function timeAgo(when) {
      const now = new Date();
      const diff = now - new Date(when);
    
      const seconds = Math.floor(diff / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);
      const months = Math.floor(days / 30);
      const years = Math.floor(days / 365);
    
      if (years > 1) {
        return `${years} years ago`;
      } else if (years === 1) {
        return '1 year ago';
      } else if (months > 1) {
        return `${months} months ago`;
      } else if (months === 1) {
        return '1 month ago';
      } else if (days > 1) {
        return `${days} days ago`;
      } else if (days === 1) {
        return '1 day ago';
      } else if (hours > 0 & hours < 24) {
        return `${hours} hours ago`;
      } else if (minutes > 1 & minutes < 60) {
        return `${minutes} minutes ago`;
      } else {
        return 'Just now';
      }
    }

  </script>
</body>
</html>
